name: astrbot

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astrbot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: astrbot-pip-3.13-v1

      - name: Clone AstrBot source
        run: |
          git clone --depth 1 https://github.com/AstrBotDevs/AstrBot.git /tmp/astrbot
          cd /tmp/astrbot
          echo "ASTRBOT_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Install deps
        run: |
          cd /tmp/astrbot
          pip install --quiet .

      - name: Generate runtime config
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          ROUTER_API_KEY: ${{ secrets.ROUTER_API_KEY }}
          ROUTER_URL: ${{ secrets.ROUTER_URL }}
          MODEL_NAME: "Flash-lite"
          ASTRBOT_ADMIN_IDS: ${{ secrets.ASTRBOT_ADMIN_IDS }}
          ASTRBOT_DASH_PASSWORD: ${{ secrets.ASTRBOT_DASH_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ASTRBOT_DATA_DIR: ${{ github.workspace }}/astrbot-data-root/data
        run: python gen_config.py

      - name: Restore state from last run
        run: |
          mkdir -p astrbot-data-root/data
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin state --depth 1
            git checkout origin/state -- state/ 2>/dev/null || true
            # restore into data dir (explicitly delete the redacted cmd_config.json from the checkout so it never gets copied or loaded)
            rm -f state/cmd_config.json
            # dist/ is poison: AstrBot bundles its own matching dist every release.
            # Restoring an old dist mixes chunk hashes across versions (franken-dist) → WebUI 404s after login.
            rm -rf state/dist
            # broken half-installed plugins (missing core .py files) — never restore;
            # they'd fail import every boot until reinstalled clean from marketplace
            rm -rf state/plugins/astrbot_plugin_music \
                   state/plugins/astrbot_plugin_private_companion \
                   state/plugins/astrbot_plugin_parser
            rsync -a state/ astrbot-data-root/data/ || true
            echo "state restored from origin/state (config + dist + broken plugins excluded)"
          else
            echo "no prior state branch — fresh boot"
          fi

      - name: Start state pusher (background)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ASTRBOT_DATA_DIR: ${{ github.workspace }}/astrbot-data-root/data
          STATE_PUSH_INTERVAL: "1"
        run: |
          nohup python push_state.py > push_state.log 2>&1 &
          echo "pusher started"

      - name: Start WebUI tunnel + DM link to admins
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          ASTRBOT_ADMIN_IDS: ${{ secrets.ASTRBOT_ADMIN_IDS }}
          ASTRBOT_DATA_DIR: ${{ github.workspace }}/astrbot-data-root/data
          DASH_PASSWORD: ${{ secrets.ASTRBOT_DASH_PASSWORD }}
        run: |
          chmod +x gui_tunnel.sh
          nohup ./gui_tunnel.sh > gui_tunnel_runner.log 2>&1 &
          echo "tunnel launcher started (waits for dashboard port, then DMs link)"

      - name: Install local plugin (webui_link)
        run: |
          mkdir -p astrbot-data-root/data/plugins
          cp -r plugins/webui_link astrbot-data-root/data/plugins/
          echo "webui_link plugin installed"

      - name: Run AstrBot (4h45m window)
        working-directory: /tmp/astrbot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          ROUTER_API_KEY: ${{ secrets.ROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # Official v4.28+ path: AstrBot hashes this into pbkdf2_password at boot
          ASTRBOT_DASHBOARD_INITIAL_PASSWORD: ${{ secrets.ASTRBOT_DASH_PASSWORD }}
          # CRITICAL: AstrBot resolves data/ from ASTRBOT_ROOT (cwd fallback).
          # Root = parent of the data dir we generated.
          ASTRBOT_ROOT: ${{ github.workspace }}/astrbot-data-root
          RUN_MINUTES: "285"
        run: |
          echo "Running AstrBot @ $ASTRBOT_COMMIT for ${RUN_MINUTES}m"
          # tee to data/ dir so push_state pushes it to Git every minute!
          timeout ${RUN_MINUTES}m python main.py 2>&1 | tee ${{ github.workspace }}/astrbot-data-root/data/astrbot-boot.log || true
          echo "window ended — exiting cleanly for next cron"

      - name: Upload boot log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astrbot-boot-log
          path: astrbot-boot.log
          retention-days: 3

# registration nudge

# schedule re-registration touch
